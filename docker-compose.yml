version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: docshield-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=super-secure-jwt-secret-key-docshield-2026
      - DATABASE_URL=sqlite:////app/docshield.db
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./storage:/app/storage
      - ./docshield.db:/app/docshield.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: docshield-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
